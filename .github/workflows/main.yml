name: CI

on: [push]

permissions:
    contents: read
    id-token: write # npm trusted publishing (OIDC) - npm validates this file (main.yml), not the shared workflow

jobs:
    build:
        uses: fabulator/workflows/.github/workflows/npm-package.yml@v1
        secrets:
            release-token: ${{ secrets.GHUB_BOT_TOKEN }}
